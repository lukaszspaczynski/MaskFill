<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>ING Mask Fill — ustawienia</title>
    <link rel="stylesheet" href="../popup/popup.css" />
    <style>
      body { width: 360px; }
      input[type="password"] { width: 100%; box-sizing: border-box; padding: 5px; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>Hasło do Moje ING</h1>
    <p class="subtle">
      Hasło trafia do pęku kluczy macOS. Rozszerzenie odczytuje z niego wyłącznie
      znaki z pozycji, o które pyta bank.
    </p>

    <p id="state" class="subtle" role="status"></p>

    <label for="password">Pełne hasło</label>
    <input type="password" id="password" autocomplete="off" spellcheck="false" />

    <div class="row">
      <button id="save" type="button">Zapisz</button>
      <button id="clear" type="button">Usuń zapisane</button>
    </div>

    <p id="message" class="message" hidden></p>
    <script src="options.js"></script>
  </body>
</html>
