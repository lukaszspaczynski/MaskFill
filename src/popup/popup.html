<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Mask Fill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Mask Fill</h1>
    <p id="summary" class="subtle">Sprawdzam stronę…</p>
    <p id="positions" class="positions" hidden></p>

    <section id="entry" hidden>
      <label for="once">Hasło</label>
      <input type="password" id="once" autocomplete="current-password"
             spellcheck="false" />
      <button id="fill-once" type="button" disabled>Wypełnij i zapomnij</button>
      <p class="hint">
        Wypełnij z menedżera, wklej lub wpisz ręcznie.
        Nie zostaje nigdzie zapisane.
      </p>
    </section>

    <p id="message" class="message" hidden></p>
    <button id="open-options" class="link" type="button">Ustawienia…</button>
    <script src="popup.js"></script>
  </body>
</html>
